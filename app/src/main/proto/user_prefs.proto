syntax = "proto3";

option java_package = "com.example.condospace";
option java_multiple_files = true;

message UserPreferences {
    string uuid = 1;
    string name = 2;
    string phone_number = 3;
    string profile_picture = 4;
    string email = 5;
    string cep = 6;
    string condominium_name = 7;
}
